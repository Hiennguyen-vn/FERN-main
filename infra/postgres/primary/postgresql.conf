listen_addresses = '*'
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = '512MB'
hot_standby = on
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = auto
track_io_timing = on
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.save = on

# Synchronous replication for RPO=0 on critical writes.
# Replica registers as application_name=sync_replica (set in primary_conninfo).
# Default synchronous_commit=on (durable on local + sync_replica WAL receive).
# Per-transaction control: services that need stronger guarantee call
#   SET LOCAL synchronous_commit = 'remote_apply';   -- finance/audit ledger writes
# Services that prefer availability over durability call
#   SET LOCAL synchronous_commit = 'local';          -- non-critical analytics
synchronous_standby_names = 'FIRST 1 (sync_replica)'
synchronous_commit = on
