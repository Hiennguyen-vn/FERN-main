# Patroni 3-node HA overlay. Use alongside docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.patroni.yml up -d
# Replaces single primary+replica with leader-elected cluster + etcd DCS.
# HAProxy in front routes write traffic to leader, read traffic to replicas.

version: "3.9"

services:
  etcd1:
    image: quay.io/coreos/etcd:v3.5.13
    container_name: etcd1
    environment:
      ETCD_NAME: etcd1
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: fern-patroni-token
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd1:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd1:2379
    networks: [fern-net]

  etcd2:
    image: quay.io/coreos/etcd:v3.5.13
    container_name: etcd2
    environment:
      ETCD_NAME: etcd2
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: fern-patroni-token
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd2:2379
    networks: [fern-net]

  etcd3:
    image: quay.io/coreos/etcd:v3.5.13
    container_name: etcd3
    environment:
      ETCD_NAME: etcd3
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: fern-patroni-token
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd3:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd3:2379
    networks: [fern-net]

  patroni1:
    image: ghcr.io/zalando/spilo-16:3.2-p1
    container_name: patroni1
    hostname: patroni1
    depends_on: [etcd1, etcd2, etcd3]
    environment:
      ETCD_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      SCOPE: fern-pg
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: ${POSTGRES_SUPER_PASSWORD:-fern_super_dev}
      PGUSER_REPLICATION: replicator
      PGPASSWORD_REPLICATION: ${POSTGRES_REPL_PASSWORD:-fern_repl_dev}
      PGUSER_ADMIN: fern
      PGPASSWORD_ADMIN: ${POSTGRES_ADMIN_PASSWORD:-fern_local_dev}
    volumes:
      - patroni1-data:/home/postgres/pgdata
    networks: [fern-net]

  patroni2:
    image: ghcr.io/zalando/spilo-16:3.2-p1
    container_name: patroni2
    hostname: patroni2
    depends_on: [etcd1, etcd2, etcd3]
    environment:
      ETCD_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      SCOPE: fern-pg
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: ${POSTGRES_SUPER_PASSWORD:-fern_super_dev}
      PGUSER_REPLICATION: replicator
      PGPASSWORD_REPLICATION: ${POSTGRES_REPL_PASSWORD:-fern_repl_dev}
      PGUSER_ADMIN: fern
      PGPASSWORD_ADMIN: ${POSTGRES_ADMIN_PASSWORD:-fern_local_dev}
    volumes:
      - patroni2-data:/home/postgres/pgdata
    networks: [fern-net]

  patroni3:
    image: ghcr.io/zalando/spilo-16:3.2-p1
    container_name: patroni3
    hostname: patroni3
    depends_on: [etcd1, etcd2, etcd3]
    environment:
      ETCD_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      SCOPE: fern-pg
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: ${POSTGRES_SUPER_PASSWORD:-fern_super_dev}
      PGUSER_REPLICATION: replicator
      PGPASSWORD_REPLICATION: ${POSTGRES_REPL_PASSWORD:-fern_repl_dev}
      PGUSER_ADMIN: fern
      PGPASSWORD_ADMIN: ${POSTGRES_ADMIN_PASSWORD:-fern_local_dev}
    volumes:
      - patroni3-data:/home/postgres/pgdata
    networks: [fern-net]

  pg-haproxy:
    image: haproxy:2.9-alpine
    container_name: pg-haproxy
    depends_on: [patroni1, patroni2, patroni3]
    ports:
      - "15432:5432"  # write (leader)
      - "15433:5433"  # read (replicas)
    volumes:
      - ./postgres/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [fern-net]

volumes:
  patroni1-data:
  patroni2-data:
  patroni3-data:

networks:
  fern-net:
    external: true
