x-kafka-common-env: &kafka-common-env
  KAFKA_HEAP_OPTS: "-Xms128M -Xmx256M"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka:29093}
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-1}
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-1}
  KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR:-1}
  KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-1}
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-3}
  KAFKA_LOG_RETENTION_HOURS: 24
  KAFKA_LOG_RETENTION_BYTES: 1073741824
  KAFKA_LOG_SEGMENT_BYTES: 536870912
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    image: fern/postgres:16-partman
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fern}
      POSTGRES_USER: ${POSTGRES_USER:-fern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fern}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-repl_user}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-repl_pass}
      POSTGRES_REPLICATION_SLOT: ${POSTGRES_REPLICATION_SLOT:-fern_replica_slot}
      POSTGRES_REPLICA_FORCE_RESEED: ${POSTGRES_REPLICA_FORCE_RESEED:-false}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./postgres/primary/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fern} -d ${POSTGRES_DB:-fern} >/dev/null 2>&1 && psql -U ${POSTGRES_USER:-fern} -d ${POSTGRES_DB:-fern} -Atqc \"SELECT CASE WHEN pg_is_in_recovery() THEN 'not-primary' ELSE 'primary' END\" | grep '^primary$' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: fern/postgres:16-partman
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fern}
      POSTGRES_USER: ${POSTGRES_USER:-fern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fern}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-repl_user}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-repl_pass}
      POSTGRES_REPLICATION_SLOT: ${POSTGRES_REPLICATION_SLOT:-fern_replica_slot}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_REPLICA_PORT:-5433}:5432"
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./postgres/replica/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/replica/setup-replica.sh:/usr/local/bin/setup-replica.sh:ro
    entrypoint: ["/usr/local/bin/setup-replica.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fern} -d ${POSTGRES_DB:-fern} >/dev/null 2>&1 && psql -U ${POSTGRES_USER:-fern} -d ${POSTGRES_DB:-fern} -Atqc \"SELECT CASE WHEN pg_is_in_recovery() AND COALESCE((SELECT status FROM pg_stat_wal_receiver LIMIT 1), 'stopped') = 'streaming' THEN 'streaming' ELSE 'not-streaming' END\" | grep '^streaming$' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer-1:
    image: edoburu/pgbouncer:v1.23.1-p3
    hostname: pgbouncer-1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_APP_USER:-fern_app} >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer-2:
    image: edoburu/pgbouncer:v1.23.1-p3
    hostname: pgbouncer-2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_APP_USER:-fern_app} >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer-lb:
    image: haproxy:2.9-alpine
    hostname: pgbouncer-lb
    restart: unless-stopped
    depends_on:
      pgbouncer-1:
        condition: service_healthy
      pgbouncer-2:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGBOUNCER_PORT:-6432}:6432"
      - "127.0.0.1:${PGBOUNCER_STATS_PORT:-8404}:8404"
    volumes:
      - ./pgbouncer-lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8404/stats >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    hostname: redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-replica-1:
    image: redis:7-alpine
    profiles: ["ha"]
    hostname: redis-replica-1
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redis-replica-1-data:/data
      - ./redis/redis-replica.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-replica-2:
    image: redis:7-alpine
    profiles: ["ha"]
    hostname: redis-replica-2
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redis-replica-2-data:/data
      - ./redis/redis-replica.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel-1:
    image: redis:7-alpine
    profiles: ["ha"]
    hostname: redis-sentinel-1
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel-2:
    image: redis:7-alpine
    profiles: ["ha"]
    hostname: redis-sentinel-2
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel-3:
    image: redis:7-alpine
    profiles: ["ha"]
    hostname: redis-sentinel-3
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka
    restart: unless-stopped
    mem_limit: 2g
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-local-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-2:
    image: confluentinc/cp-kafka:7.8.0
    profiles: ["ha"]
    hostname: kafka-2
    mem_limit: 1g
    environment:
      <<: *kafka-common-env
      KAFKA_PROCESS_ROLES: broker
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT_2:-9094}
    ports:
      - "127.0.0.1:${KAFKA_PORT_2:-9094}:9092"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/kafka-broker-api-versions --bootstrap-server kafka-2:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-3:
    image: confluentinc/cp-kafka:7.8.0
    profiles: ["ha"]
    hostname: kafka-3
    mem_limit: 1g
    environment:
      <<: *kafka-common-env
      KAFKA_PROCESS_ROLES: broker
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT_3:-9095}
    ports:
      - "127.0.0.1:${KAFKA_PORT_3:-9095}:9092"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/kafka-broker-api-versions --bootstrap-server kafka-3:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  master-node:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.spring-service
      args:
        MODULE_PATH: services/master-node
    restart: unless-stopped
    mem_limit: 384m
    environment: &service-env
      JAVA_TOOL_OPTIONS: "${SERVICE_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=35 -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -Xss256k}"
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fern}}
      DB_REPLICA_URL: jdbc:postgresql://postgres-replica:5432/${POSTGRES_DB:-fern}
      DEPENDENCIES_POSTGRES_POOL_SIZE: ${DEPENDENCIES_POSTGRES_POOL_SIZE:-2}
      POSTGRES_USER: ${POSTGRES_USER:-fern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fern}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-fern_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-fern_app}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEPENDENCIES_REDIS_SENTINEL_MASTER: ${REDIS_SENTINEL_MASTER:-}
      DEPENDENCIES_REDIS_SENTINEL_NODES: ${REDIS_SENTINEL_NODES:-}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:29092}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP:-kafka:29092}
      MASTER_NODE_URL: http://master-node:8082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-dorabets_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      WORKER_ID: ${WORKER_ID:-1}
      SERVER_PORT: 8082
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-0.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MASTER_NODE_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep UP >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.gateway
    restart: unless-stopped
    mem_limit: 512m
    environment: &gateway-env
      JAVA_TOOL_OPTIONS: "${GATEWAY_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=35 -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -Xss256k}"
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fern}}
      DB_REPLICA_URL: jdbc:postgresql://postgres-replica:5432/${POSTGRES_DB:-fern}
      POSTGRES_USER: ${POSTGRES_USER:-fern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fern}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-core}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SENTINEL_MASTER: ${REDIS_SENTINEL_MASTER:-}
      REDIS_SENTINEL_NODES: ${REDIS_SENTINEL_NODES:-}
      MASTER_NODE_URL: http://master-node:8082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set}
      AUTH_SERVICE_URL: http://auth-service:8081
      ORG_SERVICE_URL: http://org-service:8083
      HR_SERVICE_URL: http://hr-service:8084
      PRODUCT_SERVICE_URL: http://product-service:8085
      PROCUREMENT_SERVICE_URL: http://procurement-service:8086
      SALES_SERVICE_URL: http://sales-service:8087
      INVENTORY_SERVICE_URL: http://inventory-service:8088
      PAYROLL_SERVICE_URL: http://payroll-service:8089
      FINANCE_SERVICE_URL: http://finance-service:8090
      AUDIT_SERVICE_URL: http://audit-service:8091
      REPORT_SERVICE_URL: http://report-service:8092
      AI_QUERY_SERVICE_URL: http://aia-gent:8093
      SYNC_SERVICE_URL: http://sync-service:8094
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:29092}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SYNC_WS_OUTLET_IDS: ${SYNC_WS_OUTLET_IDS:-1,2,3,4,5}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-dorabets_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      PORT: 8080
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-0.0}
      GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: ${GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT:-180s}
      # AIA-gent complex questions (large tables, multi-step reasoning) can
      # take a while — give them 3 minutes before the circuit breaker fires.
      GATEWAY_AI_QUERY_TIMEOUT: ${GATEWAY_AI_QUERY_TIMEOUT:-180s}
      GATEWAY_AI_QUERY_SLOW_CALL_THRESHOLD: ${GATEWAY_AI_QUERY_SLOW_CALL_THRESHOLD:-60s}
    depends_on:
      master-node:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway-2:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.gateway
    profiles: ["ha"]
    restart: unless-stopped
    environment: *gateway-env
    depends_on:
      master-node:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway-lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./gateway-lb/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/lb/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.spring-service
      args:
        MODULE_PATH: services/auth-service/spring
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *service-env
      SERVER_PORT: 8081
    depends_on:
      master-node:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AUTH_SERVICE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  org-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.spring-service
      args:
        MODULE_PATH: services/org-service
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *service-env
      SERVER_PORT: 8083
    depends_on:
      master-node:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ORG_SERVICE_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep UP >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  hr-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.spring-service
      args:
        MODULE_PATH: services/hr-service
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *service-env
      SERVER_PORT: 8084
    depends_on:
      master-node:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HR_SERVICE_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep UP >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  product-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.spring-service
      args:
        MODULE_PATH: services/product-service
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *service-env
      SERVER_PORT: 8085
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET_PRODUCT_IMAGES: ${S3_BUCKET_PRODUCT_IMAGES:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_CONSOLE_ENDPOINT: ${S3_CONSOLE_ENDPOINT:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
    depends_on:
      master-node:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PRODUCT_SERVICE_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep UP >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  procurement-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.spring-service
      args:
        MODULE_PATH: services/procurement-service
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *service-env
      SERVER_PORT: 8086
    depends_on:
      master-node:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROCUREMENT_SERVICE_PORT:-8086}:8086"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep UP >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  sales-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.spring-service
      args:
        MODULE_PATH: services/sales-service
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *service-env
      SERVER_PORT: 8087
    depends_on:
      master-node:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SALES_SERVICE_PORT:-8087}:8087"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep UP >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

