  sync-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.spring-service
      args:
        MODULE_PATH: services/sync-service
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *service-env
      SERVER_PORT: 8094
      SYNC_MODE: ${SYNC_MODE:-CENTRAL}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      SYNC_UPLOAD_INTERVAL_SECONDS: ${SYNC_UPLOAD_INTERVAL_SECONDS:-15}
      SYNC_DOWNLOAD_INTERVAL_SECONDS: ${SYNC_DOWNLOAD_INTERVAL_SECONDS:-15}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-100}
      CENTRAL_SYNC_URL: ${CENTRAL_SYNC_URL:-http://sync-service:8094}
    depends_on:
      master-node:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SYNC_SERVICE_PORT:-8094}:8094"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8094/actuator/health | grep UP >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    profiles: ["analytics", "ai"]
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-1536m}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9100}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/users.d/default-settings.xml:/etc/clickhouse-server/users.d/default-settings.xml:ro
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./clickhouse/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./clickhouse/migrations:/docker-entrypoint-initdb.d/migrations:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8123/ping >/dev/null && clickhouse-client --query \"EXISTS DATABASE fern\" | grep -qx 1 && clickhouse-client --query \"EXISTS DATABASE analytics\" | grep -qx 1 && clickhouse-client --query \"EXISTS DATABASE cdc\" | grep -qx 1 || exit 1",
        ]
      interval: 20s
      timeout: 15s
      retries: 8

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.6.0
    profiles: ["cdc"]
    mem_limit: 1536m
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: "-Xms192M -Xmx384M"
      CONNECT_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP:-kafka:29092}
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: fern-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: ${KAFKA_CONNECT_REPLICATION_FACTOR:-1}
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: ${KAFKA_CONNECT_REPLICATION_FACTOR:-1}
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: ${KAFKA_CONNECT_REPLICATION_FACTOR:-1}
      CONNECT_OFFSET_STORAGE_PARTITIONS: "25"
      CONNECT_STATUS_STORAGE_PARTITIONS: "5"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components,/usr/share/java/kafka
      CONNECT_PLUGIN_DISCOVERY: service_load
      CONNECT_LOG4J_LOGGERS: org.apache.kafka.connect.runtime.rest=WARN,org.reflections=ERROR
      KAFKA_CONNECT_INSTALL_CLICKHOUSE: ${KAFKA_CONNECT_INSTALL_CLICKHOUSE:-false}
    ports:
      - "127.0.0.1:${KAFKA_CONNECT_PORT:-8094}:8083"
    volumes:
      - ./kafka-connect/connectors:/connectors:ro
      - ./kafka-connect/register-connectors.sh:/register-connectors.sh:ro
    command:
      - bash
      - -c
      - |
        confluent-hub install --no-prompt debezium/debezium-connector-postgresql:2.5.4 || true
        if [ "$${KAFKA_CONNECT_INSTALL_CLICKHOUSE:-false}" = "true" ]; then
          confluent-hub install --no-prompt clickhouse/clickhouse-kafka-connect:latest || true
        fi
        /etc/confluent/docker/run &
        connect_pid=$$!
        (
          sleep 60
          /bin/sh /register-connectors.sh || true
        ) &
        wait "$${connect_pid}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8083/connectors >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  opensearch:
    image: infra-opensearch-lite:2.12.0
    build:
      context: ./opensearch
    profiles: ["search"]
    mem_limit: 1024m
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      bootstrap.memory_lock: "false"
      knn.plugin.enabled: "true"
      node.store.allow_mmap: "false"
      processors: "1"
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.12.0
    profiles: ["search"]
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.18
    profiles: ["secrets"]
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-fern-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8200/v1/sys/health | grep -q initialized || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    profiles: ["tracing"]
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-fern}:${POSTGRES_PASSWORD:-fern}@postgres:5432/${POSTGRES_DB:-fern}?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres-replica-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    depends_on:
      postgres-replica:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-fern}:${POSTGRES_PASSWORD:-fern}@postgres-replica:5432/${POSTGRES_DB:-fern}?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0-alpine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: "redis://redis:6379"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9121/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis-replica-1-exporter:
    image: oliver006/redis_exporter:v1.66.0-alpine
    profiles: ["ha"]
    restart: unless-stopped
    depends_on:
      redis-replica-1:
        condition: service_healthy
    environment:
      REDIS_ADDR: "redis://redis-replica-1:6379"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9121/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis-replica-2-exporter:
    image: oliver006/redis_exporter:v1.66.0-alpine
    profiles: ["ha"]
    restart: unless-stopped
    depends_on:
      redis-replica-2:
        condition: service_healthy
    environment:
      REDIS_ADDR: "redis://redis-replica-2:6379"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9121/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "--kafka.server=kafka:29092"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9308/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:11-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fern}
      FLYWAY_USER: ${POSTGRES_USER:-fern}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-fern}
      FLYWAY_DEFAULT_SCHEMA: ${POSTGRES_SCHEMA:-core}
      FLYWAY_SCHEMAS: ${POSTGRES_SCHEMA:-core}
      FLYWAY_LOCATIONS: filesystem:/workspace/db/migrations
    volumes:
      - ../db:/workspace/db:ro
      - ../db/flyway.conf:/flyway/conf/flyway.conf:ro

  db-tools:
    image: postgres:16-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-fern}
      PGUSER: ${POSTGRES_USER:-fern}
      PGPASSWORD: ${POSTGRES_PASSWORD:-fern}
    working_dir: /workspace
    volumes:
      - ../db:/workspace/db:rw

  aia-gent:
    build:
      context: ../AIA-gent
      dockerfile: Dockerfile
    profiles: ["ai"]
    container_name: aia-gent
    ports:
      - "127.0.0.1:${AI_QUERY_SERVICE_PORT:-8093}:8093"
    # Multi-route LLM config (cx/gpt-5.4 → codex-5.5 → gpt-4.1 → gpt-4o-mini → openai direct)
    # is defined in AIA-gent/.env and forwarded here. The `environment:` block below
    # overrides infrastructure-specific values (hostnames, ports for other containers).
    env_file:
      - ../AIA-gent/.env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      SUPERVISOR_MODEL: ${AIA_SUPERVISOR_MODEL:-openai:gpt-4o}
      SPECIALIST_MODEL: ${AIA_SPECIALIST_MODEL:-openai:gpt-4o-mini}
      EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${AIA_CLICKHOUSE_DATABASE:-fern}
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_USERNAME: ""
      OPENSEARCH_PASSWORD: ""
      OPENSEARCH_INDEX: ${OPENSEARCH_METADATA_INDEX:-ai_metadata}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      SERVICE_PORT: "8093"
      SQL_GUARD_ENABLED: "true"
      RBAC_INJECT_ENABLED: "true"
      MAX_ROWS_PER_QUERY: "1000"
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:29092}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-aia-gent-fern}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      S3_BUCKET_AI_EXPORTS: ${S3_BUCKET_AI_EXPORTS:-}
      S3_BUCKET_PRODUCT_IMAGES: ${S3_BUCKET_PRODUCT_IMAGES:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      # LLM_ROUTES + per-route vars come from env_file (AIA-gent/.env).
      # Do NOT set LLM_ROUTES here — it would override the env_file value.
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8093/api/v1/ai-query/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  postgres-primary-data:
  postgres-replica-data:
  redis-data:
  redis-replica-1-data:
  redis-replica-2-data:
  kafka-local-data:
  kafka-data:
  kafka-2-data:
  kafka-3-data:
  minio-data:
  clickhouse-data:
  opensearch-data:
  ai-query-exports:
