groups:
  - name: fleet-lag
    interval: 30s
    rules:
      - alert: PosOutboxDepthHigh
        expr: max_over_time(client_outbox_depth[10m]) > 1000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "POS device outbox depth > 1000 events for 10m"
          description: "Device sustained outbox backlog. Likely network partition or central ingest stall."

      - alert: PosOutboxP95High
        expr: histogram_quantile(0.95, sum(rate(client_outbox_depth[5m])) by (le)) > 500
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "POS outbox depth p95 > 500 across fleet"
          description: "Fleet-wide sync degradation; investigate gateway / sales-service ingest path."

      - alert: PosClockSkewHigh
        expr: max_over_time(client_clock_skew_seconds[10m]) > 60
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "POS device clock skew > 60s on outlet={{ $labels.outlet_id }}"
          description: "NTP failure or hardware drift; events may land in wrong business_date."

      - alert: PosDexieStorageHigh
        expr: dexie_storage_usage_ratio > 0.85
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "POS Dexie storage > 85% on outlet={{ $labels.outlet_id }}"
          description: "Browser quota near limit; sync may stop. Investigate retention / pruning."

      - alert: PosSyncFailedRateSpike
        expr: rate(client_failed_events_total[5m]) > 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "POS device {{ $labels.device_id }} failed event rate > 6/min"
          description: "Device sync failures sustained; check device JWT validity, manifest signature."
