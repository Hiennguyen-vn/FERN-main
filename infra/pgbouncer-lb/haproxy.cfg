global
    maxconn 4096
    log stdout format raw local0

defaults
    mode tcp
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    log global
    option tcplog
    option redispatch
    retries 2

frontend pgbouncer_front
    bind *:6432
    default_backend pgbouncer_back

backend pgbouncer_back
    balance leastconn
    option tcp-check
    server pgb1 pgbouncer-1:6432 check inter 2s rise 2 fall 2
    server pgb2 pgbouncer-2:6432 check inter 2s rise 2 fall 2

frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    http-request use-service prometheus-exporter if { path /metrics }
