apiVersion: v1
kind: Namespace
metadata:
  name: fern-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: fern-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: fern-secrets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vault
  ports:
    - name: api
      port: 8200
      targetPort: 8200
---
apiVersion: v1
kind: Service
metadata:
  name: vault-internal
  namespace: fern-secrets
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: vault
  ports:
    - name: api
      port: 8200
      targetPort: 8200
    - name: cluster
      port: 8201
      targetPort: 8201
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: fern-secrets
spec:
  serviceName: vault-internal
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
    spec:
      serviceAccountName: vault
      terminationGracePeriodSeconds: 30
      containers:
        - name: vault
          image: hashicorp/vault:1.18
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              cat >/tmp/vault.hcl <<EOF
              ui = true
              disable_mlock = false
              api_addr = "https://${HOSTNAME}.vault-internal.fern-secrets.svc.cluster.local:8200"
              cluster_addr = "https://${HOSTNAME}.vault-internal.fern-secrets.svc.cluster.local:8201"

              listener "tcp" {
                address = "0.0.0.0:8200"
                cluster_address = "0.0.0.0:8201"
                tls_cert_file = "/vault/tls/tls.crt"
                tls_key_file = "/vault/tls/tls.key"
              }

              storage "raft" {
                path = "/vault/data"
                retry_join { leader_api_addr = "https://vault-0.vault-internal.fern-secrets.svc.cluster.local:8200" }
                retry_join { leader_api_addr = "https://vault-1.vault-internal.fern-secrets.svc.cluster.local:8200" }
                retry_join { leader_api_addr = "https://vault-2.vault-internal.fern-secrets.svc.cluster.local:8200" }
              }

              seal "awskms" {
                region = "REPLACE_AWS_REGION"
                kms_key_id = "REPLACE_KMS_KEY_ID"
              }
              EOF
              exec vault server -config=/tmp/vault.hcl
          env:
            - name: VAULT_ADDR
              value: https://127.0.0.1:8200
            - name: VAULT_CLUSTER_ADDR
              value: https://$(HOSTNAME).vault-internal.fern-secrets.svc.cluster.local:8201
          ports:
            - name: api
              containerPort: 8200
            - name: cluster
              containerPort: 8201
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "vault status -format=json >/dev/null"]
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          volumeMounts:
            - name: data
              mountPath: /vault/data
            - name: tls
              mountPath: /vault/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: vault-tls
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
