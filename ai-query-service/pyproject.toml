[project]
name = "ai-query-service"
version = "1.0.0"
description = "FERN AI Text-to-SQL sidecar for Vietnamese F&B Q&A"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "openai>=1.30",
    "langgraph>=0.2",
    "langgraph-checkpoint-redis>=0.1",
    "clickhouse-connect>=0.7",
    "psycopg[binary]>=3.2",
    "opensearch-py>=2.5",
    "redis>=5.0",
    "aiokafka>=0.11",
    "sqlglot>=23",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "golden: optional golden-query execution tests; run with RUN_GOLDEN=1",
]
