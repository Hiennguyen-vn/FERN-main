# Gợi ý nội bộ cho Template Matcher (tiếng Việt, 1 dòng / template).
T01_daily_revenue: "Doanh thu gộp theo ngày (tổng tiền trong khoảng from–to)."
T02_revenue_by_outlet: "Doanh thu theo cửa hàng (outlet)."
T03_revenue_by_category: "Doanh thu theo danh mục/món."
T04_top_products: "Top sản phẩm bán chạy theo số lượng hoặc doanh thu (có limit)."
T05_revenue_trend_7d: "Xu hướng doanh thu 7 ngày gần nhất."
T06_revenue_trend_30d: "Xu hướng doanh thu 30 ngày gần nhất."
T07_revenue_comparison_yoy: "So sánh doanh thu Year-over-Year trong khoảng chọn."
T08_revenue_by_payment_method: "Doanh thu theo phương thức thanh toán."
T09_avg_basket_size: "Giá trị đơn trung bình (basket)."
T10_transaction_count: "Số lượng giao dịch / hóa đơn trong khoảng thời gian."
T11_inventory_current_stock: "Tồn kho hiện tại theo SKU/sản phẩm."
T12_inventory_low_stock: "Cảnh báo SKU tồn dưới ngưỡng."
T13_inventory_movement_summary: "Tổng hợp nhập/xuất/điều chỉnh tồn theo kỳ."
T14_inventory_consumption_rate: "Tốc độ tiêu hao / rotation tồn kho (theo kỳ)."
T15_inventory_reorder_alerts: "Gợi ý cần đặt hàng lại (theo rule tồn)."
T16_product_sales_mix: "Mix doanh thu theo sản phẩm (đóng góp %)."
T17_category_contribution: "Đóng góp doanh thu theo danh mục."
T18_product_rank_by_outlet: "Xếp hạng sản phẩm theo outlet (top/bottom, limit)."
T19_slow_moving_products: "Sản phẩm bán chậm / ít luân chuyển."
T20_product_discount_analysis: "Phân tích giảm giá / discount theo sản phẩm."
T21_outlet_performance: "Chỉ số hiệu suất outlet (doanh thu, đơn… theo kỳ)."
T22_outlet_rank: "Xếp hạng cửa hàng theo chỉ số kỳ."
T23_peak_hour_analysis: "Giờ cao điểm bán trong khoảng thời gian."
T24_daily_pnl_summary: "Tóm tắt P&L/ngày — mẫu tài chính (RBAC chặt)."
T25_expense_breakdown: "Chi phí theo nhóm — tài chính (RBAC chặt)."
T26_goods_receipt_summary: "Tổng hợp nhập hàng / GR (mua hàng)."
T27_payroll_cost_by_outlet: "Chi phí lương tổng hợp theo outlet — không phải danh sách nhân viên."
T28_payment_capture_analysis: "Thanh toán / capture (POS) theo kỳ."
T29_stock_low_events: "Sự kiện tồn thấp (theo kỳ CDC/event)."
T30_sale_cancellation_rate: "Tỷ lệ hủy đơn / void theo outlet hoặc kỳ."
