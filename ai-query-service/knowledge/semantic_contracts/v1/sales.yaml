version: 1
domain: sales
description_vi: Doanh thu, số giao dịch, AOV, sản phẩm và payment từ POS analytics marts.
datasets:
  - name: analytics.ai_sales_daily
    grain: outlet_id + business_date
    time_column: business_date
    time_semantics_vi: ngày kinh doanh POS theo ca/ngày F&B
    outlet_rbac: outlet_id
    caveats:
      - Doanh thu mặc định là net_revenue, không phải gross_revenue.
  - name: analytics.ai_product_daily
    grain: outlet_id + business_date + product_id
    time_column: business_date
    time_semantics_vi: ngày kinh doanh bán hàng theo sản phẩm
    outlet_rbac: outlet_id
    caveats:
      - qty là tổng số lượng bán POS, không phải số SKU trong catalog.
  - name: analytics.ai_payment_daily
    grain: outlet_id + business_date + payment_method
    time_column: business_date
    time_semantics_vi: ngày kinh doanh của payment split
    outlet_rbac: outlet_id
metrics:
  - id: net_revenue
    measure: sum(net_revenue)
    definition_vi: Doanh thu ròng sau giảm giá/điều chỉnh theo dữ liệu bán hàng đã đồng bộ.
    source_dataset: analytics.ai_sales_daily
    allowed_dimensions: [business_date, outlet_id, outlet_code, outlet_name]
    synonyms: [doanh thu, doanh số, revenue, sales, gmv]
    golden_cases: [SAL-001, SAL-004, SAL-006, SAL-010]
  - id: txn_count
    measure: sum(txn_count)
    definition_vi: Số giao dịch bán hàng hợp lệ.
    source_dataset: analytics.ai_sales_daily
    allowed_dimensions: [business_date, outlet_id, outlet_code, outlet_name]
    synonyms: [số đơn, giao dịch, transaction count]
    golden_cases: [SAL-022]
  - id: product_revenue
    measure: sum(revenue)
    definition_vi: Doanh thu theo sản phẩm hoặc danh mục sản phẩm.
    source_dataset: analytics.ai_product_daily
    allowed_dimensions: [business_date, outlet_id, product_id, product_name, category_code]
    synonyms: [top sản phẩm, sản phẩm bán chạy, nhóm món, danh mục]
    golden_cases: [PRD-001]
insights:
  - id: sales_driver_scan
    template_key: INS_SALES_DRIVER
    method_vi: So sánh kỳ hiện tại với kỳ liền trước cùng độ dài, rank outlet theo absolute delta revenue.
  - id: sales_anomaly_scan
    template_key: ANOM_SALES
    method_vi: So current daily average với rolling baseline 28 ngày, yêu cầu ít nhất 14 ngày baseline.
  - id: revenue_forecast
    template_key: FORECAST_REVENUE
    method_vi: Pace forecast theo run-rate tháng hiện tại; không kết luận target nếu chưa có target table.
