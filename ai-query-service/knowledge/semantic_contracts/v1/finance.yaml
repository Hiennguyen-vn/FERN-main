version: 1
domain: finance
description_vi: Finance/P&L core mart cho doanh thu, chi phí, payroll, lợi nhuận vận hành và margin.
datasets:
  - name: analytics.ai_finance_daily
    grain: outlet_id + business_date
    time_column: business_date
    time_semantics_vi: ngày kinh doanh finance mart theo cửa hàng
    outlet_rbac: outlet_id
    role_group: finance
    caveats:
      - goods_receipt_cost là chi phí nhập/nhận hàng, không phải COGS mặc định.
      - actual_or_theoretical_cogs hiện bằng 0 cho đến khi có consumption/recipe cost mart.
metrics:
  - id: operating_profit
    measure: sum(operating_profit)
    definition_vi: Revenue trừ actual_or_theoretical_cogs, payroll_cost và expense_amount.
    source_dataset: analytics.ai_finance_daily
    allowed_dimensions: [business_date, outlet_id, outlet_code, outlet_name]
    synonyms: [lợi nhuận, profit, operating profit, p&l, margin]
    golden_cases: [FIN-001]
  - id: goods_receipt_cost
    measure: sum(goods_receipt_cost)
    definition_vi: Tổng giá trị phiếu nhập/nhận hàng đã post; không gọi là giá vốn bán hàng.
    source_dataset: analytics.ai_finance_daily
    allowed_dimensions: [business_date, outlet_id, outlet_code, outlet_name]
    synonyms: [phiếu nhập, nhập hàng, goods receipt, chi phí nhập hàng]
    golden_cases: [FIN-004]
  - id: payroll_cost
    measure: sum(payroll_cost)
    definition_vi: Chi phí lương đã ghi nhận trong finance mart.
    source_dataset: analytics.ai_finance_daily
    allowed_dimensions: [business_date, outlet_id, outlet_code, outlet_name]
    synonyms: [chi phí lương, payroll cost, labor cost]
    golden_cases: [FIN-003]
insights:
  - id: finance_driver_scan
    template_key: INS_FINANCE_DRIVER
    method_vi: So sánh operating_profit giữa kỳ hiện tại và kỳ liền trước, kèm revenue/goods_receipt/payroll/expense hiện tại.
  - id: finance_anomaly_scan
    template_key: ANOM_FINANCE
    method_vi: So operating profit daily average với rolling baseline 28 ngày, yêu cầu ít nhất 14 ngày baseline.
  - id: profit_forecast
    template_key: FORECAST_PROFIT
    method_vi: Pace forecast lợi nhuận tháng hiện tại; không kết luận target nếu chưa có target table.
