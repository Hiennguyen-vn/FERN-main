name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend unit and integration tests
        run: mvn -B -Pintegration-tests verify
      - name: OWASP dependency check
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SQL migration and regression tests
        run: ./db/scripts/run_sql_tests.sh
      - name: Migration safety lint
        run: ./db/scripts/migrate-safe.sh --lint

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:run
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build

  pos-edge:
    runs-on: ubuntu-latest
    services:
      postgres-edge:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pos_edge_test
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos_edge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            FERN-pos-edge/package-lock.json
            FERN-pos-edge/agent/package-lock.json
      - name: Install POS edge frontend dependencies
        working-directory: FERN-pos-edge
        run: npm ci
      - name: Lint POS edge frontend
        working-directory: FERN-pos-edge
        run: npm run lint
      - name: Build POS edge frontend
        working-directory: FERN-pos-edge
        run: npm run build
      - name: Audit POS edge frontend dependencies
        working-directory: FERN-pos-edge
        run: npm audit --audit-level=high
      - name: Install Playwright Chromium
        working-directory: FERN-pos-edge
        run: npx playwright install --with-deps chromium
      - name: POS edge E2E
        working-directory: FERN-pos-edge
        run: CI=1 E2E_PORT=5176 E2E_HUB_PORT=18100 npm run test:e2e
      - name: Install POS edge agent dependencies
        working-directory: FERN-pos-edge/agent
        run: npm ci
      - name: Lint POS edge agent
        working-directory: FERN-pos-edge/agent
        run: npm run lint
      - name: Typecheck POS edge agent
        working-directory: FERN-pos-edge/agent
        run: npm run typecheck
      - name: Build POS edge agent
        working-directory: FERN-pos-edge/agent
        run: npm run build
      - name: Test POS edge agent
        working-directory: FERN-pos-edge/agent
        run: npm test
      - name: Audit POS edge agent dependencies
        working-directory: FERN-pos-edge/agent
        run: npm audit --audit-level=high

  frontend-outdated:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Review outdated frontend dependencies
        run: npm outdated || true
