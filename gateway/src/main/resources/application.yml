server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO

spring:
  application:
    name: gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT_MS:2000}
        response-timeout: ${GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT:10s}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  threads:
    virtual:
      enabled: true
  main:
    web-application-type: reactive

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATIO:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

info:
  service:
    name: ${spring.application.name}
    description: Spring Cloud Gateway ingress for FERN ERP.

spring.config.import: ${VAULT_CONFIG_IMPORT:optional:vault://}
spring.cloud.vault:
  enabled: ${VAULT_ENABLED:false}
  uri: ${VAULT_ADDR:http://localhost:8200}
  token: ${VAULT_TOKEN:}
  authentication: ${VAULT_AUTHENTICATION:TOKEN}
  app-role:
    role-id: ${VAULT_ROLE_ID:}
    secret-id: ${VAULT_SECRET_ID:}
  database:
    enabled: ${VAULT_DATABASE_ENABLED:false}
    backend: ${VAULT_DATABASE_BACKEND:database}
    role: ${VAULT_DATABASE_ROLE:fern-${spring.application.name}}
    username-property: dependencies.postgres.username
    password-property: dependencies.postgres.password
  fail-fast: false
  kv:
    enabled: true
    backend: kv
    default-context: fern/shared
    application-name: fern/services/${spring.application.name}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: ${GATEWAY_CIRCUIT_SLOW_CALL_THRESHOLD:2s}
        waitDurationInOpenState: ${GATEWAY_CIRCUIT_OPEN_WAIT:30s}
    instances:
      auth-service:
        baseConfig: default
      master-node:
        baseConfig: default
      org-service:
        baseConfig: default
      hr-service:
        baseConfig: default
      product-service:
        baseConfig: default
      procurement-service:
        baseConfig: default
      sales-service:
        baseConfig: default
      inventory-service:
        baseConfig: default
      payroll-service:
        baseConfig: default
      finance-service:
        baseConfig: default
      audit-service:
        baseConfig: default
      report-service:
        baseConfig: default
      sync-service:
        baseConfig: default
      ai-query-service:
        baseConfig: default
        slowCallDurationThreshold: ${GATEWAY_AI_QUERY_SLOW_CALL_THRESHOLD:45s}
  timelimiter:
    configs:
      default:
        timeoutDuration: ${GATEWAY_CIRCUIT_TIMEOUT:30s}
        cancelRunningFuture: true
    instances:
      auth-service:
        baseConfig: default
      master-node:
        baseConfig: default
      org-service:
        baseConfig: default
      hr-service:
        baseConfig: default
      product-service:
        baseConfig: default
      procurement-service:
        baseConfig: default
      sales-service:
        baseConfig: default
      inventory-service:
        baseConfig: default
      payroll-service:
        baseConfig: default
      finance-service:
        baseConfig: default
      audit-service:
        baseConfig: default
      report-service:
        baseConfig: default
      sync-service:
        baseConfig: default
      ai-query-service:
        baseConfig: default
        timeoutDuration: ${GATEWAY_AI_QUERY_TIMEOUT:120s}
      ai-query-service-api-v1-ai-query:
        baseConfig: default
        timeoutDuration: ${GATEWAY_AI_QUERY_TIMEOUT:120s}

sync:
  ws:
    outlet-ids: ${SYNC_WS_OUTLET_IDS:1,2,3,4,5}

fern:
  gateway:
    cors:
      allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:}
      allowed-methods: ${GATEWAY_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
      allowed-headers: ${GATEWAY_CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Correlation-ID}
      exposed-headers: ${GATEWAY_CORS_EXPOSED_HEADERS:X-Correlation-ID,X-Gateway-Upstream-Service}

dependencies:
  postgres:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fern}
    username: ${VAULT_DB_USERNAME:${spring.datasource.username:${POSTGRES_APP_USER:${POSTGRES_USER:fern}}}}
    password: ${VAULT_DB_PASSWORD:${spring.datasource.password:${POSTGRES_APP_PASSWORD:${POSTGRES_PASSWORD:fern}}}}
    poolSize: ${DB_POOL_SIZE:8}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  kafka:
    bootstrap: ${KAFKA_BOOTSTRAP:localhost:9092}
  masterNode:
    baseUrl: ${MASTER_NODE_URL:http://localhost:8082}
    heartbeatEnabled: true
    heartbeatLeaseSeconds: ${CONTROL_HEARTBEAT_LEASE_SECONDS:30}
    heartbeatIntervalSeconds: ${CONTROL_HEARTBEAT_INTERVAL_SECONDS:10}
