server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: sales-service
  threads:
    virtual:
      enabled: true
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fern}
    user: ${VAULT_DB_USERNAME:${spring.datasource.username:${POSTGRES_APP_USER:${POSTGRES_USER:fern}}}}
    password: ${VAULT_DB_PASSWORD:${spring.datasource.password:${POSTGRES_APP_PASSWORD:${POSTGRES_PASSWORD:fern}}}}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATIO:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

info:
  service:
    name: ${spring.application.name}
    description: Sales, POS session, promotion, and payment service bootstrap.

dependencies:
  postgres:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fern}
    username: ${VAULT_DB_USERNAME:${spring.datasource.username:${POSTGRES_APP_USER:${POSTGRES_USER:fern}}}}
    password: ${VAULT_DB_PASSWORD:${spring.datasource.password:${POSTGRES_APP_PASSWORD:${POSTGRES_PASSWORD:fern}}}}
    poolSize: ${DB_POOL_SIZE:16}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  kafka:
    bootstrap: ${KAFKA_BOOTSTRAP:localhost:9092}
  masterNode:
    baseUrl: ${MASTER_NODE_URL:http://localhost:8082}

outbox:
  relay:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:1000}
  dlq:
    enabled: ${OUTBOX_DLQ_ENABLED:true}
    fixed-delay-ms: ${OUTBOX_DLQ_FIXED_DELAY_MS:5000}
    topic: ${OUTBOX_DLQ_TOPIC:fern.outbox.dlq}

spring.config.import: ${VAULT_CONFIG_IMPORT:optional:vault://}
spring.cloud.vault:
  enabled: ${VAULT_ENABLED:false}
  uri: ${VAULT_ADDR:http://localhost:8200}
  token: ${VAULT_TOKEN:}
  authentication: ${VAULT_AUTHENTICATION:TOKEN}
  app-role:
    role-id: ${VAULT_ROLE_ID:}
    secret-id: ${VAULT_SECRET_ID:}
  database:
    enabled: ${VAULT_DATABASE_ENABLED:false}
    backend: ${VAULT_DATABASE_BACKEND:database}
    role: ${VAULT_DATABASE_ROLE:fern-${spring.application.name}}
    username-property: dependencies.postgres.username
    password-property: dependencies.postgres.password
  fail-fast: false
  kv:
    enabled: true
    backend: kv
    default-context: fern/shared
    application-name: fern/services/${spring.application.name}

# ── FERN custom settings ──────────────────────────────────────────────
fern:
  cache:
    idempotency-cleanup-enabled: ${FERN_CACHE_IDEMPOTENCY_CLEANUP_ENABLED:true}
    idempotency-cleanup-ms: ${FERN_CACHE_IDEMPOTENCY_CLEANUP_MS:3600000}
    idempotency-cleanup-initial-delay-ms: ${FERN_CACHE_IDEMPOTENCY_CLEANUP_INITIAL_DELAY_MS:60000}
    idempotency-cleanup-batch-size: ${FERN_CACHE_IDEMPOTENCY_CLEANUP_BATCH_SIZE:5000}
    idempotency-cleanup-max-batches: ${FERN_CACHE_IDEMPOTENCY_CLEANUP_MAX_BATCHES:10}
  sync:
    manifest-private-key-pkcs8-b64: ${FERN_SYNC_MANIFEST_PRIVATE_KEY_PKCS8_B64:}
    manifest-key-id: ${FERN_SYNC_MANIFEST_KEY_ID:dev-key}
  loyalty:
    mock-otp: ${FERN_LOYALTY_MOCK_OTP:true}
    mock-otp-code: ${FERN_LOYALTY_MOCK_OTP_CODE:123456}
