server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: product-service
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATIO:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

info:
  service:
    name: ${spring.application.name}
    description: Product catalog, pricing, tax, and recipe service bootstrap.

dependencies:
  postgres:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fern}
    username: ${POSTGRES_APP_USER:${POSTGRES_USER:fern}}
    password: ${POSTGRES_APP_PASSWORD:${POSTGRES_PASSWORD:fern}}
    poolSize: ${DB_POOL_SIZE:16}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  kafka:
    bootstrap: ${KAFKA_BOOTSTRAP:localhost:9092}
  masterNode:
    baseUrl: ${MASTER_NODE_URL:http://localhost:8082}

spring.config.import: ${VAULT_CONFIG_IMPORT:optional:vault://}
spring.cloud.vault:
  enabled: ${VAULT_ENABLED:false}
  uri: ${VAULT_ADDR:http://localhost:8200}
  token: ${VAULT_TOKEN:}
  fail-fast: false
  kv:
    enabled: true
    backend: kv
    default-context: fern/shared
    application-name: fern/services/${spring.application.name}
