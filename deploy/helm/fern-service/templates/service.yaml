apiVersion: v1
kind: Service
metadata:
  name: {{ include "fern-service.name" . }}
  labels:
    {{- include "fern-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: http
    port: {{ .Values.ports.http }}
    targetPort: http
  selector:
    {{- include "fern-service.selectorLabels" . | nindent 4 }}
